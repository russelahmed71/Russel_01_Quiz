<!DOCTYPE html>
<html>
<head>
    <title>Add Question</title>
</head>
<body>
    <h2>Add Question to {{ quiz.title }}</h2>
    <form method="POST">
        {% csrf_token %}
        <p>
            <label>Question:</label><br>
            <input type="text" name="question_text" required>
        </p>
        <p>Select the correct answer:</p>
        <p><input type="radio" name="correct_option" value="1" checked> Option 1: <input type="text" name="option1" required></p>
        <p><input type="radio" name="correct_option" value="2"> Option 2: <input type="text" name="option2" required></p>
        <p><input type="radio" name="correct_option" value="3"> Option 3: <input type="text" name="option3"></p>
        <p><input type="radio" name="correct_option" value="4"> Option 4: <input type="text" name="option4"></p>
        
        <button type="submit">Save Question</button>
    </form>
    <br>
    <a href="{% url 'dashboard' %}">Back to Dashboard</a>
</body>
</html>
